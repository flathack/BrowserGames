<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Farben-Blitz 🎨</title>
  <meta name="description" content="Farben-Blitz: Tippe auf die richtige Farbe! Ein fröhliches Farbspiel für Kinder (4–6 J.) – ganz ohne Verlieren, nur viel Lob." />
  <style>
    /* ---------- Design-System (konsistent mit den anderen Spielen) ---------- */
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --panel-2: #1b2130;
      --ink: #eef2fb;
      --muted: #9aa4bd;
      --accent: #5b8cff;
      --accent-2: #7c5bff;
      --good: #35d49a;
      --line: rgba(255,255,255,0.08);
      --shadow: 0 18px 50px rgba(0,0,0,0.45);
      --r: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(91,140,255,0.16), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(124,91,255,0.14), transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    .stage {
      width: min(640px, 100%);
      height: 100%;
      max-height: 920px;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: calc(var(--r) + 6px);
      box-shadow: var(--shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ---------- Kopfzeile / HUD ---------- */
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .logo {
      width: 46px; height: 46px; border-radius: 14px; flex: 0 0 auto;
      background: conic-gradient(from 210deg, #ff5d73, #f7e64b, #5b8cff, #7c5bff, #ff5d73);
      display: grid; place-items: center; font-size: 24px;
      box-shadow: 0 8px 24px rgba(124,91,255,0.35);
    }
    .title { font-size: 19px; font-weight: 800; letter-spacing: 0.2px; line-height: 1.1; }
    .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
    .hud { display: flex; gap: 8px; align-items: center; }
    .pill {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      padding: 8px 12px; border-radius: 12px;
      min-width: 86px; text-align: center;
    }
    .pill .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .pill .v { font-size: 17px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .pill .v.good { color: var(--good); }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(255,255,255,0.05);
      font-size: 20px; cursor: pointer; display: grid; place-items: center;
      transition: background .15s ease, transform .08s ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn:focus-visible, .btn:focus-visible, .swatch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* ---------- Spielfeld ---------- */
    .play { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 0; padding: 6px 0; }

    /* Großer Ziel-Beutel */
    .target { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .target-bag {
      width: min(46vw, 200px); height: min(46vw, 200px);
      border-radius: 30px; position: relative; overflow: hidden;
      box-shadow: 0 22px 54px rgba(0,0,0,0.5), inset 0 -18px 30px rgba(0,0,0,0.28), inset 0 14px 24px rgba(255,255,255,0.3);
      will-change: transform;
    }
    .bag-shine { position: absolute; top: 14%; left: 15%; width: 34%; height: 22%; background: rgba(255,255,255,0.42); border-radius: 50%; filter: blur(3px); }
    .bag-emoji { position: absolute; inset: 0; display: grid; place-items: center; font-size: min(20vw, 84px); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3)); }
    .target-name { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 1px; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,0.4); }

    /* Feedback-Bubble (Lob / Ermutigung) */
    .bubble {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: min(92%, 480px); min-height: 60px; padding: 12px 18px; border-radius: 18px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      font-size: clamp(16px, 4.6vw, 23px); font-weight: 700; text-align: center;
    }
    .bubble .b-emoji { font-size: clamp(24px, 6.4vw, 34px); flex: 0 0 auto; }

    /* Farbtupfer (Antworten) – immer 1 Reihe mit 4 großen Feldern */
    .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: min(92%, 460px); margin: 0 auto; }
    @media (max-width: 420px) { .swatches { gap: 10px; } }
    .swatch {
      width: 100%; aspect-ratio: 1 / 1;
      border-radius: 22px; border: 3px solid rgba(255,255,255,0.16); cursor: pointer;
      box-shadow: 0 12px 26px rgba(0,0,0,0.42), inset 0 6px 12px rgba(255,255,255,0.28), inset 0 -10px 18px rgba(0,0,0,0.25);
      touch-action: none; -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, box-shadow .16s ease;
    }
    .swatch:active { transform: scale(0.95); }
    .swatch.correct { box-shadow: 0 0 0 4px #fff, 0 0 30px rgba(255,255,255,0.55); transform: scale(1.1); }

    /* ---------- Overlays ---------- */
    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(8,10,15,0.74); backdrop-filter: blur(7px);
      border-radius: calc(var(--r) + 6px); z-index: 20;
    }
    .overlay.hidden { display: none; }
    .card {
      width: min(440px, calc(100% - 32px));
      background: linear-gradient(180deg, rgba(27,33,48,0.97), rgba(20,24,33,0.97));
      border: 1px solid var(--line); border-radius: 20px; padding: 26px 22px;
      box-shadow: var(--shadow); text-align: center;
    }
    .card h2 { margin: 0 0 10px; font-size: 26px; }
    .card p { margin: 0 0 16px; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .card p b { color: var(--ink); }
    .start-keys { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 22px; text-align: left; }
    .sk { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; color: var(--muted); }
    .sk span { font-size: 22px; flex: 0 0 auto; }
    .btnrow { display: flex; gap: 10px; justify-content: center; }
    .btn {
      border: 1px solid var(--line); border-radius: 14px; padding: 14px 20px;
      font: inherit; font-weight: 800; cursor: pointer; color: var(--ink);
      background: rgba(255,255,255,0.06); transition: transform .08s ease, background .15s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: white; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.big { font-size: 19px; padding: 16px 28px; border-radius: 16px; }

    /* Konfetti-Canvas (Vollbild, kein Pointer) */
    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

    /* ---------- Animationen ---------- */
    @keyframes happy { 0% { transform: scale(1); } 30% { transform: scale(1.2) rotate(-5deg); } 60% { transform: scale(0.94) rotate(4deg); } 100% { transform: scale(1); } }
    .target-bag.happy { animation: happy 0.6s ease; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
    .swatch.shake { animation: shake 0.45s ease; }
    @keyframes pop { 0% { transform: scale(0.82); opacity: 0.3; } 100% { transform: scale(1); opacity: 1; } }
    .bubble.pop { animation: pop 0.25s ease; }
    @keyframes starIn { 0% { transform: scale(0); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
    .pill .v.starpulse { animation: starIn 0.4s ease; }

    @media (max-width: 1100px) and (max-height: 500px) {
      /* Querformat auf kleinem Screen: alles kompakter, kein Overflow */
      .stage { padding: 10px; }
      .head { margin-bottom: 6px; }
      .logo { width: 38px; height: 38px; font-size: 20px; }
      .title { font-size: 16px; }
      .sub { display: none; }
      .pill { min-width: 70px; padding: 6px 10px; }
      .play { gap: 8px; padding: 0; }
      .target-bag { width: min(34vw, 130px); height: min(34vw, 130px); border-radius: 20px; }
      .bag-emoji { font-size: min(15vw, 52px); }
      .target-name { font-size: clamp(22px, 7vw, 36px); }
      .bubble { min-height: 42px; padding: 8px 12px; font-size: 15px; }
      .b-emoji { font-size: 22px; }
      .swatches { gap: 10px; width: min(96%, 420px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .target-bag.happy, .swatch.shake, .bubble.pop, .pill .v.starpulse { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="stage">
    <div class="head">
      <div class="brand">
        <div class="logo">🎨</div>
        <div>
          <div class="title">Farben-Blitz</div>
          <div class="sub">Tippe auf die richtige Farbe!</div>
        </div>
      </div>
      <div class="hud">
        <div class="pill"><div class="k">Sterne</div><div class="v good" id="hud-stars">⭐ 0</div></div>
        <button class="icon-btn" id="sound-btn" aria-label="Ton an/aus" title="Ton an/aus">🔊</button>
        <button class="icon-btn" id="reset-btn" aria-label="Neu starten" title="Neu starten">🔄</button>
      </div>
    </div>

    <section class="play">
      <div class="target">
        <div class="target-bag" id="target-bag">
          <span class="bag-shine"></span>
          <span class="bag-emoji">🛍️</span>
        </div>
        <div class="target-name" id="target-name">?</div>
      </div>

      <div class="bubble" id="bubble">
        <span class="b-emoji" id="bubble-emoji">😊</span>
        <span id="bubble-text">Welche Farbe ist das?</span>
      </div>

      <div class="swatches" id="swatches" role="group" aria-label="Farben zum Antippen"></div>
    </section>

    <!-- Start -->
    <div class="overlay" id="start-screen">
      <div class="card">
        <h2>Farben-Blitz 🎨</h2>
        <p>Der Beutel zeigt eine Farbe. <b>Tippe auf die gleiche Farbe</b> – ganz ohne Zeitdruck, nur viel Spaß! 🎉</p>
        <div class="start-keys">
          <div class="sk"><span>🛍️</span> Der Beutel zeigt eine Farbe</div>
          <div class="sk"><span>👆</span> Tippe die gleiche Farbe an</div>
          <div class="sk"><span>🌟</span> Jede Treffer gibt 1 Stern</div>
        </div>
        <div class="btnrow">
          <button class="btn primary big" id="start-btn">Los geht's! 🎨</button>
        </div>
      </div>
    </div>
  </main>

  <script>
  (() => {
    "use strict";

    // ---------- Farben (klar unterscheidbar, Kern-Vokabular 4–6 J.) ----------
    const COLORS = [
      { name: "ROT",     hex: "#ff5d73" },
      { name: "BLAU",    hex: "#5b8cff" },
      { name: "GELB",    hex: "#f7e64b" },
      { name: "GRÜN",    hex: "#5bd47a" },
      { name: "VIOLETT", hex: "#7c5bff" },
    ];
    const PRAISE    = ["Super!", "Genial!", "Wunderbar!", "Klasse!", "Stark!", "Toll!", "Hui, krass!", "Perfekt!"];
    const ENCOURAGE = ["Nochmal!", "Fast!", "Du schaffst das!", "Guck genau hin!", "Noch ein Versuch!"];

    // ---------- DOM ----------
    const targetBag   = document.getElementById("target-bag");
    const targetName  = document.getElementById("target-name");
    const bubble      = document.getElementById("bubble");
    const bubbleEmoji = document.getElementById("bubble-emoji");
    const bubbleText  = document.getElementById("bubble-text");
    const swatchesEl  = document.getElementById("swatches");
    const hudStars    = document.getElementById("hud-stars");
    const startScreen = document.getElementById("start-screen");
    const startBtn    = document.getElementById("start-btn");
    const soundBtn    = document.getElementById("sound-btn");
    const resetBtn    = document.getElementById("reset-btn");

    // ---------- State ----------
    const state = {
      running: false,
      locked: false,      // kurze Sperre nach Treffer (kein Doppel-Tipp)
      target: 0,          // Index der richtigen Farbe
      options: [],        // 4 gezeigte Farben (inkl. Ziel), gemischt
      stars: 0,
      soundOn: true,
    };

    // ---------- Hilfsfunktionen ----------
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
      r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
      return `rgb(${r},${g},${b})`;
    }
    function pickHex() { return COLORS[(Math.random() * COLORS.length) | 0].hex; }

    // ---------- Sound (WebAudio, erst nach User-Input, mit Stummschalt) ----------
    let audioCtx = null;
    function beep(freq, dur = 0.12, type = "sine", gain = 0.16) {
      if (!state.soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(audioCtx.destination);
        o.start(t); o.stop(t + dur);
      } catch (_) {}
    }
    function playCorrect() { beep(523, 0.12); setTimeout(() => beep(659, 0.12), 90); setTimeout(() => beep(784, 0.18), 180); }
    function playWrong()   { beep(196, 0.16, "triangle", 0.07); }
    function playStart()   { beep(392, 0.1); setTimeout(() => beep(523, 0.14), 100); }

    // ---------- Feedback-Bubble ----------
    function setBubble(emoji, text) {
      bubbleEmoji.textContent = emoji;
      bubbleText.textContent = text;
      bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");
    }
    function updateStars(pulse) {
      hudStars.textContent = "⭐ " + state.stars;
      if (pulse) { hudStars.classList.remove("starpulse"); void hudStars.offsetWidth; hudStars.classList.add("starpulse"); }
    }

    // ---------- Runde ----------
    function newRound() {
      state.target = (Math.random() * COLORS.length) | 0;
      const others = COLORS.map((_, i) => i).filter(i => i !== state.target);
      const d = shuffle(others).slice(0, 3);           // 3 Störer
      state.options = shuffle([state.target, ...d]);   // 4 Optionen, gemischt
      renderRound();
    }
    function renderRound() {
      const c = COLORS[state.target];
      targetBag.style.background = `linear-gradient(180deg, ${c.hex}, ${shade(c.hex, -34)})`;
      targetName.textContent = c.name;
      targetName.style.color = c.hex;
      setBubble("😊", "Welche Farbe ist das?");
      state.locked = false;

      swatchesEl.innerHTML = "";
      state.options.forEach(idx => {
        const el = document.createElement("button");
        el.className = "swatch";
        el.type = "button";
        el.style.background = COLORS[idx].hex;
        el.setAttribute("aria-label", COLORS[idx].name);
        el.dataset.idx = String(idx);
        // Pointer (Touch + Maus, identisch) …
        el.addEventListener("pointerdown", (e) => { e.preventDefault(); onSwatch(idx, el); });
        // … und Tastatur (Enter / Leertaste)
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); onSwatch(idx, el); }
        });
        swatchesEl.appendChild(el);
      });
      // Erstes Element fokussierbar machen (nicht automatisch fokussieren, um Scroll zu vermeiden)
    }

    function onSwatch(idx, el) {
      if (!state.running || state.locked) return;
      if (idx === state.target) {
        // ---- Treffer: Lob, Konfetti, Stern, neue Runde ----
        state.locked = true;
        state.stars += 1;
        updateStars(true);
        const c = COLORS[state.target];
        el.classList.add("correct");
        targetBag.classList.add("happy");
        setTimeout(() => targetBag.classList.remove("happy"), 620);
        const p = PRAISE[(Math.random() * PRAISE.length) | 0];
        setBubble("🎉", p);
        playCorrect();
        burstConfetti(c.hex);
        setTimeout(() => { newRound(); }, 950);
      } else {
        // ---- Falsch: sanfte Ermutigung, keine Strafe ----
        el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
        const e = ENCOURAGE[(Math.random() * ENCOURAGE.length) | 0];
        setBubble("💪", e);
        playWrong();
      }
    }

    // ---------- Start / Reset ----------
    function startGame() {
      state.running = true;
      state.stars = 0;
      updateStars(false);
      startScreen.classList.add("hidden");
      playStart();
      newRound();
    }
    function bindTap(el, fn) {
      el.addEventListener("pointerdown", (e) => { e.preventDefault(); fn(); });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); fn(); }
      });
    }
    bindTap(startBtn, startGame);
    bindTap(resetBtn, startGame);

    soundBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      state.soundOn = !state.soundOn;
      soundBtn.textContent = state.soundOn ? "🔊" : "🔇";
      if (state.soundOn) beep(660, 0.08);
    });

    // Leertaste startet auch (bequemer für Desktop)
    window.addEventListener("keydown", (e) => {
      if (!state.running && (e.key === " " || e.key === "Enter")) {
        if (startScreen.classList.contains("hidden") === false) { e.preventDefault(); startGame(); }
      }
    });

    // ---------- Konfetti (Canvas, Delta-Time) ----------
    const cconf = document.getElementById("confetti");
    const cctx = cconf.getContext("2d");
    let particles = [];
    function resizeConfetti() {
      const dpr = window.devicePixelRatio || 1;
      cconf.width = Math.round(window.innerWidth * dpr);
      cconf.height = Math.round(window.innerHeight * dpr);
      cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeConfetti);
    resizeConfetti();

    function targetCenter() {
      const r = targetBag.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    function burstConfetti(hex) {
      const { x, y } = targetCenter();
      const n = window.innerWidth < 520 ? 34 : 50;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 130 + Math.random() * 240;
        particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 140,
          t: 0,
          life: 0.9 + Math.random() * 0.6,
          size: 4 + Math.random() * 6,
          hex: Math.random() < 0.55 ? hex : pickHex(),
        });
      }
    }
    let lastT = performance.now();
    function loop(now) {
      let dt = (now - lastT) / 1000; lastT = now;
      if (dt > 0.05) dt = 0.05;
      // Physik
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        if (p.t >= p.life) { particles.splice(i, 1); continue; }
        p.vy += 540 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      // Zeichnen
      cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const p of particles) {
        const a = 1 - p.t / p.life;
        cctx.globalAlpha = Math.max(0, a);
        cctx.fillStyle = p.hex;
        cctx.beginPath();
        cctx.arc(p.x, p.y, p.size * (0.6 + a * 0.4), 0, Math.PI * 2);
        cctx.fill();
      }
      cctx.globalAlpha = 1;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ---------- Tests / Debug-API ----------
    window.__farbenBlitz = {
      state, newRound, onSwatch, start: startGame,
      get target() { return state.target; },
      get stars() { return state.stars; },
      get running() { return state.running; },
    };
  })();
  </script>
</body>
</html>
