<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23f87171'/%3E%3Cpath d='M16 7c1-2 3-3 5-3' stroke='%2334d399' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 22h16l-2 7H10z' fill='%23d6a35c'/%3E%3C/svg%3E" />
  <title>Frucht-Fang</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #0f172a;
      --text: #e5eef8;
      --muted: #9fb3c8;
      --accent: #f472b6;
      --accent-2: #fbbf24;
      --border: rgba(148, 163, 184, 0.18);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(1100px 700px at 15% 0%, rgba(244, 114, 182, 0.14), transparent 45%),
        radial-gradient(900px 600px at 90% 15%, rgba(251, 191, 36, 0.10), transparent 40%),
        var(--bg);
      overscroll-behavior: none;
    }

    .app {
      width: min(680px, 100%);
      display: grid;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 34px);
      letter-spacing: 0.02em;
      text-shadow: 0 0 24px rgba(244, 114, 182, 0.3);
    }

    h1 .emoji { text-shadow: none; }

    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
    }

    .stat {
      display: flex;
      flex-direction: column;
      min-width: 76px;
    }

    .stat span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .stat strong {
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .harvest {
      display: flex;
      gap: 2px;
      font-size: 20px;
      line-height: 1;
      min-height: 22px;
      flex-wrap: wrap;
      max-width: 180px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      font-size: 22px;
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .icon-btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 10 / 13;
      max-height: min(72vh, 780px);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(30, 41, 59, 0.55), rgba(11, 18, 32, 0.9)),
        radial-gradient(600px 300px at 50% 100%, rgba(251, 191, 36, 0.08), transparent 60%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: grab;
    }

    canvas.grabbing { cursor: grabbing; }

    .praise {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 800;
      color: var(--accent-2);
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.9);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .praise.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: rgba(11, 18, 32, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .overlay.hidden { display: none; }

    .overlay .big {
      font-size: clamp(56px, 14vw, 96px);
      line-height: 1;
      filter: drop-shadow(0 8px 24px rgba(244, 114, 182, 0.35));
    }

    .overlay h2 {
      margin: 0;
      font-size: clamp(22px, 5vw, 32px);
    }

    .overlay p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      max-width: 40ch;
    }

    .go {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      font-size: clamp(18px, 3.4vw, 24px);
      color: #0b1220;
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      border-radius: 999px;
      padding: 16px 40px;
      box-shadow: 0 12px 30px rgba(251, 191, 36, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.18);
      touch-action: manipulation;
      min-height: 56px;
    }

    .go:active { transform: translateY(2px); }

    .go:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }

    .foot a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }

    .foot a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .praise { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1><span class="emoji" aria-hidden="true">🧺</span> Frucht-Fang</h1>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Ton an/aus" title="Ton an/aus">🔊</button>
    </header>

    <div class="hud" aria-live="off">
      <div class="stat">
        <span>Gefangen</span>
        <strong id="count">0</strong>
      </div>
      <div class="harvest" id="harvest" aria-hidden="true"></div>
    </div>

    <div class="stage">
      <canvas id="game" aria-label="Spielbereich: Ziehe, um den Korb zu bewegen und Früchte zu fangen"></canvas>
      <div class="praise" id="praise" role="status" aria-live="polite"></div>

      <div class="overlay" id="overlay">
        <div class="big" aria-hidden="true">🍎🍌🍇</div>
        <h2>Fang die Früchte!</h2>
        <p>Tippe oder ziehe irgendwo auf dem Bildschirm — der Korb folgt dir.
           Auf dem PC: <strong>← →</strong> oder <strong>A / D</strong>.<br />
           Kein Stress: Jede Frucht wird gefeiert! 🎉</p>
        <button class="go" id="startBtn" type="button">Los geht's! 🧺</button>
      </div>
    </div>

    <div class="foot">
      <a href="index.html">← Alle Spiele</a>
      <span>Spielbar mit Finger, Maus oder Tastatur</span>
    </div>
  </div>

  <script>
  "use strict";

  (() => {
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const stage = canvas.parentElement;
    const countEl = document.getElementById("count");
    const harvestEl = document.getElementById("harvest");
    const praiseEl = document.getElementById("praise");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const muteBtn = document.getElementById("muteBtn");

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---------- Zustand ----------
    const state = {
      running: false,
      W: 0,
      H: 0,
      dpr: 1,
      basket: { x: 0, targetX: 0, w: 90, h: 56, bob: 0 },
      fruits: [],        // {x, y, vy, r, emoji, rot, rotV}
      particles: [],     // {x,y,vx,vy,life,emoji|dot,color}
      splats: [],        // {x,y,life,emoji}
      caught: 0,
      spawnIn: 0.8,
      time: 0,
      praiseUntil: 0,
      lastCatchAt: 0,
    };

    const FRUITS = ["🍎", "🍌", "🍇", "🍊", "🍓", "🍑", "🍐", "🍒"];
    const PRAISES = [
      "Super! 🎉", "Toll gemacht! ⭐", "Klasse! 🌟", "Wieder! 🥳",
      "Richtig gut! 👏", "Wow! 🍀", "Genial! 💫", "Stark! 🚀",
    ];

    // ---------- Audio (iOS-freundlich: erst nach User-Input) ----------
    let audioCtx = null;
    let muted = false;

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }

    function blip(freq, dur, gainVal, type) {
      if (!audioCtx || muted) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(gainVal, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function catchSound() {
      blip(520, 0.12, 0.12, "triangle");
      setTimeout(() => blip(780, 0.16, 0.10, "triangle"), 70);
    }

    function splatSound() {
      blip(140, 0.18, 0.05, "sine");
    }

    muteBtn.addEventListener("click", () => {
      muted = !muted;
      muteBtn.textContent = muted ? "🔇" : "🔊";
      muteBtn.setAttribute("aria-label", muted ? "Ton ist aus" : "Ton ist an");
    });

    // ---------- Größe / DPI ----------
    function resize() {
      const rect = stage.getBoundingClientRect();
      state.dpr = Math.min(window.devicePixelRatio || 1, 3);
      state.W = rect.width;
      state.H = rect.height;
      canvas.width = Math.round(rect.width * state.dpr);
      canvas.height = Math.round(rect.height * state.dpr);
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      // Korbgröße an Breite anpassen (mindestens 72px breit → einfache Trefferfläche)
      const bw = Math.max(72, Math.min(120, rect.width * 0.16));
      state.basket.w = bw;
      state.basket.h = bw * 0.62;
      state.basket.x = clamp(state.basket.x || rect.width / 2, bw / 2, rect.width - bw / 2);
      state.basket.targetX = state.basket.x;
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    window.addEventListener("resize", resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

    // ---------- Eingabe: Pointer (Touch + Maus) ----------
    let pointerActive = false;

    function pointerX(e) {
      const rect = canvas.getBoundingClientRect();
      return e.clientX - rect.left;
    }

    canvas.addEventListener("pointerdown", (e) => {
      pointerActive = true;
      canvas.classList.add("grabbing");
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      state.basket.targetX = pointerX(e);
      e.preventDefault();
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!pointerActive) return;
      state.basket.targetX = pointerX(e);
    });

    function pointerEnd() {
      pointerActive = false;
      canvas.classList.remove("grabbing");
    }
    canvas.addEventListener("pointerup", pointerEnd);
    canvas.addEventListener("pointercancel", pointerEnd);
    canvas.addEventListener("lostpointercapture", pointerEnd);

    // ---------- Eingabe: Tastatur ----------
    const keys = { left: false, right: false };

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keys.left = true; e.preventDefault(); }
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keys.right = true; e.preventDefault(); }
      if (e.key === " " || e.key === "Enter") {
        if (!state.running) startGame();
        e.preventDefault();
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    });
    window.addEventListener("blur", () => { keys.left = keys.right = false; });

    // ---------- Spielstart ----------
    function startGame() {
      ensureAudio();
      state.running = true;
      overlay.classList.add("hidden");
      startBtn.blur();
    }

    startBtn.addEventListener("click", startGame);

    // ---------- Spawning ----------
    function spawnFruit() {
      const r = clamp(state.W * 0.05, 20, 34);
      const margin = r + 6;
      state.fruits.push({
        x: margin + Math.random() * (state.W - margin * 2),
        y: -r * 2,
        vy: (state.H / (3.0 + Math.random() * 1.2)) * (0.9 + Math.min(state.caught, 20) * 0.015), // ~3s durchgang, sanft schneller
        r,
        emoji: FRUITS[(Math.random() * FRUITS.length) | 0],
        rot: (Math.random() - 0.5) * 0.6,
        rotV: (Math.random() - 0.5) * 0.8,
        sway: Math.random() * Math.PI * 2,
        swayAmp: 10 + Math.random() * 18,
      });
    }

    // ---------- Lob ----------
    let praiseTimer = null;
    function showPraise(text) {
      praiseEl.textContent = text;
      praiseEl.classList.add("show");
      clearTimeout(praiseTimer);
      praiseTimer = setTimeout(() => praiseEl.classList.remove("show"), 1100);
    }

    function addCaught(emoji) {
      state.caught++;
      countEl.textContent = String(state.caught);
      const el = document.createElement("span");
      el.textContent = emoji;
      harvestEl.appendChild(el);
      while (harvestEl.children.length > 10) harvestEl.removeChild(harvestEl.firstChild);
    }

    // ---------- Effekte ----------
    function burst(x, y, emoji) {
      if (reduceMotion) return;
      const n = 10;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + Math.random() * 0.5;
        const sp = 90 + Math.random() * 140;
        state.particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 60,
          life: 0.6 + Math.random() * 0.3,
          t: 0,
          emoji: i < 6 ? "✨" : emoji,
          size: 12 + Math.random() * 8,
        });
      }
    }

    // ---------- Update ----------
    function update(dt) {
      state.time += dt;

      // Tastatur bewegt das Ziel
      const kbSpeed = 520; // px/s
      if (keys.left) state.basket.targetX -= kbSpeed * dt;
      if (keys.right) state.basket.targetX += kbSpeed * dt;
      state.basket.targetX = clamp(state.basket.targetX, state.basket.w / 2, state.W - state.basket.w / 2);

      // Korb folgt weich
      const b = state.basket;
      b.x += (b.targetX - b.x) * Math.min(1, dt * 14);
      b.bob = Math.sin(state.time * 2.2) * 2;

      // Spawning (immer freundlich: nie zu dicht)
      state.spawnIn -= dt;
      if (state.spawnIn <= 0) {
        spawnFruit();
        state.spawnIn = 1.1 + Math.random() * 0.9;
      }

      // Früchte
      const basketTop = state.H - b.h * 0.9;
      for (let i = state.fruits.length - 1; i >= 0; i--) {
        const f = state.fruits[i];
        f.y += f.vy * dt;
        f.rot += f.rotV * dt;
        f.sway += dt * 1.6;

        const fx = f.x + Math.sin(f.sway) * f.swayAmp * 0.3;

        // Gefangen?
        if (f.vy > 0 && f.y + f.r >= basketTop && f.y < state.H) {
          if (Math.abs(fx - b.x) <= b.w / 2 + f.r * 0.4) {
            state.fruits.splice(i, 1);
            addCaught(f.emoji);
            catchSound();
            if (!reduceMotion) { b.bob = 6; }
            if (state.time - state.lastCatchAt > 1.2 || state.caught <= 5) {
              showPraise(PRAISES[(Math.random() * PRAISES.length) | 0]);
              state.lastCatchAt = state.time;
            }
            burst(fx, basketTop, f.emoji);
            continue;
          }
        }

        // Verfehlt → sanftes Platschen (kein Ärger!)
        if (f.y - f.r > state.H) {
          state.fruits.splice(i, 1);
          splatSound();
          if (!reduceMotion) state.splats.push({ x: fx, y: state.H - 10, life: 1.4, emoji: f.emoji });
          showPraise("Nächstes Mal! 💪");
        }
      }

      // Partikel
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.t += dt;
        if (p.t >= p.life) { state.particles.splice(i, 1); continue; }
        p.vy += 260 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }

      // Splats verblassen
      for (let i = state.splats.length - 1; i >= 0; i--) {
        const s = state.splats[i];
        s.life -= dt;
        if (s.life <= 0) state.splats.splice(i, 1);
      }
    }

    // ---------- Render ----------
    function drawBasket() {
      const b = state.basket;
      const y = state.H - b.h * 0.9 + b.bob;
      const w = b.w;
      const h = b.h;

      ctx.save();
      ctx.translate(b.x, y);

      // Schattchen
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.ellipse(0, h * 0.62, w * 0.55, h * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();

      // Korbkörper (Trapez)
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "#e0b06a");
      grad.addColorStop(1, "#a9713a");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-w / 2, 0);
      ctx.lineTo(w / 2, 0);
      ctx.lineTo(w * 0.36, h * 0.6);
      ctx.lineTo(-w * 0.36, h * 0.6);
      ctx.closePath();
      ctx.fill();

      // Flechtmuster
      ctx.strokeStyle = "rgba(90, 50, 20, 0.35)";
      ctx.lineWidth = 2;
      for (let i = 1; i <= 3; i++) {
        const yy = (h * 0.6 * i) / 4;
        const inset = (w * 0.14 * i) / 4;
        ctx.beginPath();
        ctx.moveTo(-w / 2 + inset, yy);
        ctx.lineTo(w / 2 - inset, yy);
        ctx.stroke();
      }
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * (w / 6), 0);
        ctx.lineTo(i * (w / 6) * 0.72, h * 0.6);
        ctx.stroke();
      }

      // Rand
      ctx.fillStyle = "#c89055";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-w / 2 - 4, -6, w + 8, 14, 7) : ctx.rect(-w / 2 - 4, -6, w + 8, 14);
      ctx.fill();

      ctx.restore();
    }

    function drawFruit(f, fx) {
      ctx.save();
      ctx.translate(fx, f.y);
      ctx.rotate(f.rot);
      ctx.font = `${f.r * 2}px serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(f.emoji, 0, 0);
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, state.W, state.H);

      // Bodenglühen
      const g = ctx.createLinearGradient(0, state.H - 70, 0, state.H);
      g.addColorStop(0, "rgba(251,191,36,0)");
      g.addColorStop(1, "rgba(251,191,36,0.12)");
      ctx.fillStyle = g;
      ctx.fillRect(0, state.H - 70, state.W, 70);

      // Splats
      for (const s of state.splats) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.life / 1.4) * 0.7;
        ctx.font = "22px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(s.emoji, s.x, s.y);
        ctx.restore();
      }

      // Früchte
      for (const f of state.fruits) {
        drawFruit(f, f.x + Math.sin(f.sway) * f.swayAmp * 0.3);
      }

      drawBasket();

      // Partikel
      for (const p of state.particles) {
        const a = 1 - p.t / p.life;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = `${p.size}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.emoji, p.x, p.y);
        ctx.restore();
      }
    }

    // ---------- Loop (Delta-Time) ----------
    let last = performance.now();
    function frame(now) {
      let dt = (now - last) / 1000;
      last = now;
      if (dt > 0.05) dt = 0.05;
      if (state.running) update(dt);
      render();
      requestAnimationFrame(frame);
    }

    resize();
    state.basket.x = state.W / 2;
    state.basket.targetX = state.W / 2;
    requestAnimationFrame(frame);

    // Für Tests: kleines API
    window.__fruchtFang = {
      state,
      spawnFruit,
      start: startGame,
      catchAt: (x) => { state.basket.targetX = x; },
    };
  })();
  </script>
</body>
</html>
